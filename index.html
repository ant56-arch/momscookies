<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Owner Portal</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body class="portal">
  <div id="gate" class="gate"></div>

  <div id="app" hidden>
    <header class="p-head">
      <strong class="p-title">🍪 Owner portal</strong>
      <nav id="tabs" class="p-tabs" aria-label="Sections">
        <button data-tab="orders">Orders</button>
        <button data-tab="calendar">Calendar</button>
        <button data-tab="money">Money</button>
        <button data-tab="calculator">Calculator</button>
        <button data-tab="workbook">Workbook</button>
        <button data-tab="settings">Settings</button>
      </nav>
      <span id="savestate" class="savestate" role="status"></span>
      <button id="lock" class="btn ghost small-btn" type="button">Lock</button>
    </header>
    <main id="main" class="p-main"></main>
  </div>

  <dialog id="dlg"></dialog>
  <script src="portal.js"></script>
</body>
</html>
