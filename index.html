<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gina's Cookie Jar</title>
  <meta name="description" content="Custom decorated cookies for birthdays, graduations, showers and more.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top"><span aria-hidden="true">🍪</span> <span data-site="name">Gina's Cookie Jar</span></a>
    <nav>
      <a href="#occasions">Occasions</a>
      <a href="#order">Get a quote</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <h1 data-site="tagline">Custom decorated cookies for every celebration.</h1>
      <p data-site="heroText">Tell us about your event and we'll design a set of cookies to match.</p>
      <a class="btn" href="#order">Price your order</a>
    </section>

    <section id="occasions" class="section">
      <h2>What we make</h2>
      <div id="gallery" class="grid"></div>
    </section>

    <section id="order" class="section alt">
      <h2>Price &amp; request your order</h2>
      <div class="order-wrap">
        <form id="order-form" class="order-form" autocomplete="on">
          <label>Occasion
            <select name="occasion" id="occasion"></select>
          </label>
          <div class="two">
            <label>How many cookies?
              <input name="qty" id="qty" type="number" min="1" step="1" value="24" required>
            </label>
            <label>How many colors?
              <input name="colors" id="colors" type="number" min="1" max="12" step="1" value="3" required>
            </label>
          </div>
          <label>Date needed
            <input name="date" id="date" type="date">
          </label>
          <label class="check"><input type="checkbox" name="rush" id="rush"> <span id="rush-label">Rush order</span></label>
          <label class="check"><input type="checkbox" name="metallic" id="metallic"> <span id="metallic-label">Metallic accents</span></label>
          <label>Allergies
            <input name="allergies" placeholder="e.g. nuts, eggs — note: some icing uses almond flavor">
          </label>
          <label>Colors / theme / ideas
            <textarea name="notes" rows="3" placeholder="Team colors, names, photos you love…"></textarea>
          </label>
          <label>Your name
            <input name="name" required autocomplete="name">
          </label>
          <label>Phone or email
            <input name="contact" required>
          </label>
        </form>

        <aside class="quote" aria-live="polite">
          <h3>Your estimate</h3>
          <dl id="quote-lines"></dl>
          <div class="total-row"><span>Estimated total</span><strong id="quote-total">$0.00</strong></div>
          <p class="muted small" id="quote-note"></p>
          <button class="btn full" id="send-btn" type="button">Send request on Messenger</button>
          <p class="muted small" id="send-hint"></p>
        </aside>
      </div>
    </section>

    <section id="about" class="section">
      <h2>About</h2>
      <p data-site="about"></p>
      <ul id="contact-list" class="contact-list"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <small>&copy; <span id="year"></span> <span data-site="name"></span></small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
