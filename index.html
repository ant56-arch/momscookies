<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#4a2a18">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Owner portal for Gina's Cookie Jar.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cookie Jar">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    // Set the theme before the page paints, so there is no light/dark flash.
    (function () {
      var p = 'auto'; try { p = localStorage.getItem('gcj_theme') || 'auto'; } catch (e) {}
      document.documentElement.dataset.theme = p === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : p;
    })();
  </script>
  <title>Gina's Cookie Jar · Owner Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap">
  <link rel="stylesheet" href="styles.css?v=31">
  <link rel="stylesheet" href="portal.css?v=31">
</head>
<body class="portal">
  <a class="skip" href="#main">Skip to content</a>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-jar" viewBox="0 0 40 40">
        <rect x="10" y="3.5" width="20" height="6" rx="3" fill="#8f4a1b"/>
        <path d="M9 11h22v20a5 5 0 0 1-5 5H14a5 5 0 0 1-5-5z" fill="#fff3df" stroke="#8f4a1b" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="20" cy="25" r="7.5" fill="#d9954f"/>
        <circle cx="17.3" cy="22.8" r="1.3" fill="#5a2e14"/><circle cx="22.7" cy="24" r="1.3" fill="#5a2e14"/><circle cx="19.6" cy="28.2" r="1.3" fill="#5a2e14"/>
      </symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-5h4v5"/></symbol>
      <symbol id="i-orders" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17.5" rx="2.5"/><path d="M9 8.5h6M9 12.5h6M9 16.5h3.5"/></symbol>
      <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
      <symbol id="i-money" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M14.6 9.2c-.5-.9-1.5-1.4-2.6-1.4-1.4 0-2.5.8-2.5 2s1 1.7 2.5 2.1 2.5.9 2.5 2.1-1.1 2-2.5 2c-1.1 0-2.1-.5-2.6-1.4M12 6v1.8M12 16.4V18"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></symbol>
    </defs>
  </svg>

  <div id="gate" class="gate"></div>

  <div id="app" hidden>
    <header class="p-head">
      <a class="brand" href="./" aria-label="Gina's Cookie Jar — home">
        <svg class="jar" aria-hidden="true"><use href="#i-jar"/></svg>
        <span class="brand-name">Gina's Cookie Jar</span>
      </a>
      <nav id="tabs" class="p-tabs" aria-label="Sections">
        <button data-tab="home">Home</button>
        <button data-tab="orders">Orders</button>
        <button data-tab="calendar">Calendar</button>
        <button data-tab="photos">Photos</button>
        <button data-tab="money">Money</button>
        <button data-tab="calculator">Calculator</button>
        <button data-tab="workbook">Workbook</button>
        <button data-tab="settings">Settings</button>
      </nav>
      <span id="savestate" class="savestate" role="status"></span>
      <button id="lock" class="lock-btn" type="button">Lock</button>
    </header>

    <main id="main" class="p-main" tabindex="-1"></main>

    <nav id="bottomnav" class="bnav" aria-label="Main">
      <button data-tab="home"><svg class="ic"><use href="#i-home"/></svg><span>Home</span></button>
      <button data-tab="orders"><svg class="ic"><use href="#i-orders"/></svg><span>Orders</span></button>
      <button data-tab="calendar"><svg class="ic"><use href="#i-cal"/></svg><span>Calendar</span></button>
      <button data-tab="money"><svg class="ic"><use href="#i-money"/></svg><span>Money</span></button>
      <button data-tab="more"><svg class="ic ic-fill"><use href="#i-more"/></svg><span>More</span></button>
    </nav>
  </div>

  <dialog id="dlg"></dialog>
  <dialog id="dlg2"></dialog>
  <script src="portal.js?v=31"></script>
</body>
</html>
